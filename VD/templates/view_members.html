{% extends "hfset.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Members</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <center>
        <h1>Members of {{ community.name }}</h1>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>
                {% for member in members %}
                <tr>
                    <td>{{ member.user.name }}</td>
                    <td>{{ member.user.gender }}</td>
                    <td>{{ member.user.contacts }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">No members in this community yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </center>
</body>
</html>
{% endblock %}
