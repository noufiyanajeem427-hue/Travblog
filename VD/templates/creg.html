{% extends "hfset1.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traveler Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            background-color: #fff;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        small {
            font-size: 0.85em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h2 class="mb-4 text-center">Content Provider Registration Form</h2>
        <form method="post">
            <!-- CSRF token placeholder for Django -->
            {% csrf_token %}

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" name="name" required>
            </div>

            <!-- Age -->
            <div class="mb-3">
                <label for="age" class="form-label">Age *</label>
                <input type="number" class="form-control" name="age" required>
            </div>

            <!-- Contact -->
            <div class="mb-3">
                <label for="contact" class="form-label">Contact *</label>
                <input type="text" class="form-control" name="contact" required>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label class="form-label">Gender *</label>
                <div>
                    <input type="radio" class="form-check-input" name="gender" value="Male" required> Male
                    <input type="radio" class="form-check-input ms-3" name="gender" value="Female" required> Female
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <input type="email"  id="email" class="form-control" name="email" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password *</label>
                <input type="password" id="password" class="form-control" name="password" required>
            </div>

            <!-- Example Extra Fields -->

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
    </div>
</div>

<!-- Validation Script -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const validators = [];

    function handleValidation(input, pattern, validMsg, invalidMsg) {
        const feedback = document.createElement('small');
        feedback.style.display = 'block';
        input.parentNode.appendChild(feedback);

        function validate() {
            const value = input.value.trim();
            if (!value) {
                feedback.textContent = '❌ This field is required';
                feedback.style.color = 'red';
                return false;
            } else if (!pattern.test(value)) {
                feedback.textContent = '❌ ' + invalidMsg;
                feedback.style.color = 'red';
                return false;
            } else {
                feedback.textContent = '✅ ' + validMsg;
                feedback.style.color = 'green';
                return true;
            }
        }

        input.addEventListener('input', validate);
        validators.push(validate);
    }

    handleValidation(
        document.querySelector('input[name="name"]'),
        /^[A-Za-z ]+$/,
        'Valid name',
        'Name must contain only letters and spaces'
    );

    handleValidation(
        document.querySelector('input[name="contact"]'),
        /^\d{10}$/,
        'Valid phone number',
        'Enter a valid 10-digit phone number'
    );

    handleValidation(
        document.querySelector('input[name="email"]'),
        /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/,
        'Valid email address',
        'Enter a valid email address'
    );

    handleValidation(
        document.querySelector('input[name="password"]'),
        /^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&]).{8,}$/,
        'Strong password',
        'Password must be at least 8 characters, include uppercase, lowercase, a number, and a special character'
    );

    const requiredFields = ['District', 'City', 'Village', 'Panchayat', 'Register_no'];
    requiredFields.forEach(fieldName => {
        const input = document.querySelector(`[name="${fieldName}"]`);
        if (input) {
            const feedback = document.createElement('small');
            feedback.style.display = 'block';
            input.parentNode.appendChild(feedback);

            input.addEventListener('input', function () {
                if (input.value.trim() === '') {
                    feedback.textContent = '❌ This field is required';
                    feedback.style.color = 'red';
                } else {
                    feedback.textContent = '';
                }
            });
        }
    });

    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function (e) {
            let isValid = true;
            validators.forEach(validateFn => {
                if (!validateFn()) isValid = false;
            });
            if (!isValid) {
                e.preventDefault();
                alert("❌ Please fill all required fields and fix validation errors.");
            }
        });
    }
});
</script>

</body>
</html>
{% endblock %}
