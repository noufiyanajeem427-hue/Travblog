<!DOCTYPE html>
<html lang="en">
<body>
   <div class="card">
    <div class="card-header">
        <h4>Visitors Profile</h4>
    </div>
    <div class="card-body">
        <canvas id="chart-visitors-profile"></canvas>
    </div>
</div>

<script>
    var ctx = document.getElementById('chart-visitors-profile').getContext('2d');
    var visitorsChart = new Chart(ctx, {
        type: 'pie',  // You can use 'bar' or 'doughnut' as well
        data: {
            labels: ['Travelers', 'Content Providers'],
            datasets: [{
                data: [{{ total_traveler }}, {{ total_ContentProvider }}],
                backgroundColor: ['#3498db', '#e74c3c']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>
 
</body>
</html>
