{% extends "hfset.html" %}
{% block content %}

<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', sans-serif;
        background-color: #fff;
    }

    main {
        flex: 1;
    }

    .community-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 30px;
        background-color: #f4f6f9;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        font-weight: 600;
        margin-bottom: 30px;
        color: #2c3e50;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
    }

    th, td {
        padding: 14px 10px;
        text-align: center;
        border: 1px solid #e0e0e0;
    }

    th {
        background-color: #007bff;
        color: white;
        font-weight: 600;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    a {
        color: #007bff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    img {
        border-radius: 5px;
        width: 40px;
        height: 40px;
    }

    footer {
        background-color: #0c0e1a;
        color: white;
        text-align: center;
        padding: 20px;
    }

    footer a {
        color: #ddd;
        text-decoration: none;
    }

    footer a:hover {
        color: #fff;
        text-decoration: underline;
    }
</style>

<main>
    <div class="community-container">
        <h1>New Communities</h1>
        <table>
            <thead>
                <tr>
                    <th>Community Name</th>
                    <th>Icon</th>
                    <th>Edit</th>
                    <th>Remove</th>
                    <th>Open</th>
                    <th>Add Members</th>
                    <th>View Requests</th>
                    <th>View Members</th>
                </tr>
            </thead>
            <tbody>
                {% for community in communities %}
                <tr>
                    <td>{{ community.name }}</td>
                    <td><img src="{{ community.icon.url }}" alt="icon"></td>
                    <td><a href="{% url 'edit_community' community.id %}"><i class="fas fa-pen action-icon"></i><br>Edit</a></td>
                    <td><a href="{% url 'delete_community' community.id %}" onclick="return confirm('Are you sure?');"> <i class="fas fa-trash-alt action-icon"></i><br>Remove</a></td>
                    <td><a href="{% url 'community_detail' community.id %}"><i class="fas fa-eye action-icon"></i><br>Open</a></td>
                    <td><a href="{% url 'add_members' community.id %}"><i class="fas fa-user-plus action-icon"></i><br>Add Members</a></td>
                    <td><a href="{% url 'view_request' community.id %}"><i class="fas fa-user-clock action-icon"></i><br>View Requests</a></td>
                    <td><a href="{% url 'view_members' community.id %}"><i class="fas fa-users action-icon"></i><br>View Members</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>

{% endblock %}
